name: GF release

# Builds the Toit SDK for the girtsf fork and publishes it as a release tagged
# <latest upstream tag>-gf.<run number>, e.g. v2.0.0-alpha.199-gf.3. Run on the
# gf branch:
#
#   gh workflow run gf-release.yml -R girtsf/toit --ref gf [-f downstream=false]
#
# Afterwards it starts the envelopes build and the jag_gf release for the new
# SDK. That needs the GF_DISPATCH_TOKEN secret: a fine-grained token with
# Actions read/write on girtsf/toit-envelopes and girtsf/jaguar.
#
# The upstream workflows should be disabled in the fork.

on:
  workflow_dispatch:
    inputs:
      downstream:
        description: Start the envelopes build and the jag_gf release
        type: boolean
        default: true

env:
  # Envelope variants built by the girtsf/toit-envelopes fork.
  GF_VARIANTS: esp32-no-ble esp32s3 esp32s3-spiram-octo-16mb

permissions:
  contents: write

jobs:
  release:
    # Same as upstream releases, so that we don't depend on a recent glibc.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The fork doesn't carry upstream's tags.
      - name: Fetch upstream
        run: |
          git fetch --tags --no-recurse-submodules https://github.com/toitlang/toit.git \
              master:refs/remotes/upstream/master

      - name: Compute version
        run: |
          BASE=$(git describe --tags --abbrev=0 --match 'v[0-9]*' --exclude '*-gf.*' HEAD)
          echo "TOIT_GIT_VERSION=$BASE-gf.${{ github.run_number }}" >> $GITHUB_ENV

      - name: Setup build environment
        uses: ./actions/setup-build
        with:
          toit-dir: .

      - name: Build SDK
        run: |
          make enable-lto
          make sdk
          grep --fixed-strings --line-regexp "$TOIT_GIT_VERSION" build/host/sdk/VERSION

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          make prefix=build/out/toit install
          tar -czf build/toit-linux-x64.tar.gz -C build/out toit
          {
            echo "Upstream master: $(git merge-base HEAD upstream/master)"
            echo
            echo "Merged into gf:"
            git log --first-parent --merges --format='- %s' upstream/master..HEAD
          } > build/notes.md
          gh release create "$TOIT_GIT_VERSION" build/toit-linux-x64.tar.gz \
              --target "$GITHUB_SHA" --title "$TOIT_GIT_VERSION" --notes-file build/notes.md

      - name: Start downstream builds
        if: inputs.downstream
        env:
          GH_TOKEN: ${{ secrets.GF_DISPATCH_TOKEN }}
        run: |
          gh workflow run build.yml -R girtsf/toit-envelopes --ref gf \
              -f toit-version="$TOIT_GIT_VERSION" -f upload-release=true \
              -f build-host=false -f build-cross=false -f variant="$GF_VARIANTS"
          gh workflow run gf-release.yml -R girtsf/jaguar --ref gf \
              -f sdk-version="$TOIT_GIT_VERSION"
